# The exhaust and path tables of profiles/flat12.toml at a73b874, with the
# EngineLab path stages that the pop bank replaces. TestPopColour and
# tools/fit --pop read them.
[exhaust]
crossover = "none"
outlet_direct = 0.3
steepening = 0.3
overlap = 1.0
low_shelf_db = 10

[[path]]
collector_m = 1.30
reflection = -0.4
damping_hz = 3000
pipe_radius_m = 0.025
outlet_radius_m = 0.025
wall_loss_db = 2
wall_loss_hz = 2500
chamber_m = 0.40
chamber_area_ratio = 8
gain = 1.0

[[path]]
collector_m = 1.38
reflection = -0.4
damping_hz = 3000
pipe_radius_m = 0.025
outlet_radius_m = 0.025
wall_loss_db = 2
wall_loss_hz = 2500
chamber_m = 0.40
chamber_area_ratio = 8
gain = 0.8
listener_m = 0.15

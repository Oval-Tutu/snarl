# The exhaust and path tables of profiles/flat6.toml at a73b874, with the
# EngineLab path stages that the pop bank replaces. TestPopColour and
# tools/fit --pop read them.
[exhaust]
crossover = "full"
outlet_direct = 0.35
steepening = 0.3
overlap = 1.0
low_shelf_db = 1

[[path]]

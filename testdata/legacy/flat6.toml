reflection = -0.4
damping_hz = 2500
pipe_radius_m = 0.027
outlet_radius_m = 0.027
wall_loss_db = 3
wall_loss_hz = 1600
chamber_m = 0.32
chamber_area_ratio = 9
gain = 1.0

[[path]]

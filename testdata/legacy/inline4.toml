# The exhaust and path tables of profiles/inline4.toml at a73b874, with
# the EngineLab path stages that the pop bank replaces. TestPopColour and
# tools/fit --pop read them.
[exhaust]
crossover = "none"
outlet_direct = 0.35
steepening = 0.3
overlap = 1.0
low_shelf_db = 6

[[path]]
collector_m = 0.95
reflection = -0.4
damping_hz = 3000
pipe_radius_m = 0.026
outlet_radius_m = 0.030
wall_loss_db = 2.5
wall_loss_hz = 2200
chamber_m = 0.30
chamber_area_ratio = 7
gain = 1.0

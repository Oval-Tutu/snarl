# 180-degree V12 with shared crankpins (a flat-12), mid 1980s. Firing order
# 1-9-5-12-3-8-6-10-2-7-4-11 (unverified for this engine). Bank 0 is
# cylinders 1 to 6, bank 1 is cylinders 7 to 12. Each bank fires every 120
# degrees, like an inline-6, on its own pipe.
name = "flat12"
description = "Flat-12 with shared crankpins, one pipe per bank into one silencer"
seed = 12
idle_rpm = 1000
redline_rpm = 6800
limiter_rpm = 7000
# Unverified. Modelled as a soft ignition cut.
limiter_kind = "ignition"
# Cut length, slow-down and climb rates measured from the engine-sim
# limiter reference with the engine running free.
limiter_ms = 103
limiter_fall_rpm_s = 19500
limiter_rise_rpm_s = 59400
limiter_load_scale = 1.0
# Level of the pumping pulses in a cut, their notch after the cut starts,
# and the re-fire bark, measured from the same reference.
limiter_pump_db = 0
limiter_notch_db = -2
limiter_bark_db = 2

[pulse]
width_deg = 120
attack = 28
decay = 7.5
idle_floor = 0.18
cycle_variation = 0.07
jitter = 0.003
gain_variation = 0.3
timing_variation_deg = 6


# 180-degree V12 with shared crankpins (a flat-12), mid 1980s. Firing order
# 1-9-5-12-3-8-6-10-2-7-4-11 (unverified for this engine). Bank 0 is
# cylinders 1 to 6, bank 1 is cylinders 7 to 12. Each bank fires every 120
# degrees, like an inline-6, on its own pipe.
name = "flat12"
description = "Flat-12 with shared crankpins, one pipe per bank into one silencer"
seed = 12
idle_rpm = 1000
redline_rpm = 6800
limiter_rpm = 7000
# Unverified. Modelled as a soft ignition cut.
limiter_kind = "ignition"
# Cut length, slow-down and climb rates measured from the engine-sim
# limiter reference with the engine running free.
limiter_ms = 103
limiter_fall_rpm_s = 19500
limiter_rise_rpm_s = 59400
limiter_load_scale = 1.0
# Level of the pumping pulses in a cut, their notch after the cut starts,
# and the re-fire bark, measured from the same reference.
limiter_pump_db = 0
limiter_notch_db = -2
limiter_bark_db = 0

[pulse]
# The pulse table from engine-sim (measured): tools/fit --pulse on the
# runner pressure of the flat-12 script.
table = "flat12"
cycle_variation = 0.07
jitter = 0.003
gain_variation = 0.3
timing_variation_deg = 6

[exhaust]
crossover = "none"
overlap = 1.0
# Gains of the formant bank and the pop bank at the end of the file.
formant_gain_db = -4.95
pop_formant_gain_db = -0.82
pop_delay_ms = 0.708

[noise]
# hf_gain, am and input_jitter are the engine-sim hf_gain, noise and jitter
# of the flat12 script.
hf_gain = 0.01
am = 1.0
am_cutoff_hz = 2000
input_jitter = 0.1

[pops]
density = 0.2
character = "sport"
body_hz = 200
body_ms = 35
# A free-flowing pair of pipes into one silencer: crackle trains lead.
weight_pop = 0.3
weight_boom = 0.2
weight_crackle = 0.4
weight_burble = 0.1

[overrun]
level_db = -1.0
idle_level_db = -1.5

[idle]
variation = 0.4
timing_deg = 20
imbalance = 0.1
hunt = 0.008
rock = 0.02

[voice]
# leveller_db puts the closed-throttle idle 3 dB below the knee of the
# leveller.
leveller_db = -2.2
output_db = 0.75

[[cylinder]] # 1
crank_deg = 0
bank = 0
primary_m = 0.38
[[cylinder]] # 2
crank_deg = 480
bank = 0
primary_m = 0.44
[[cylinder]] # 3
crank_deg = 240
bank = 0
primary_m = 0.50
[[cylinder]] # 4
crank_deg = 600
bank = 0
primary_m = 0.38
[[cylinder]] # 5
crank_deg = 120
bank = 0
primary_m = 0.44
[[cylinder]] # 6
crank_deg = 360
bank = 0
primary_m = 0.50
[[cylinder]] # 7
crank_deg = 540
bank = 1
primary_m = 0.38
[[cylinder]] # 8
crank_deg = 300
bank = 1
primary_m = 0.44
[[cylinder]] # 9
crank_deg = 60
bank = 1
primary_m = 0.50
[[cylinder]] # 10
crank_deg = 420
bank = 1
primary_m = 0.38
[[cylinder]] # 11
crank_deg = 660
bank = 1
primary_m = 0.44
[[cylinder]] # 12
crank_deg = 180
bank = 1
primary_m = 0.50

[[path]]
collector_m = 1.30
reflection = -0.4
damping_hz = 3000
gain = 1.0

[[path]]
collector_m = 1.38
reflection = -0.4
damping_hz = 3000
gain = 0.8
listener_m = 0.15

# Formant bank: tools/fit --base ir --hi 16000 --tolerance 1.5 on the
# engine-sim impulse response minimal_muffling_01 of the flat12 script, 4
# sections, weighted error 1.48 dB from 40 Hz to 16 kHz. The 1 dB fit of 9
# sections cost 25 more multiply-adds per sample.
[[formant]]
kind = "highpass"
hz = 112.7
q = 1.649

[[formant]]
kind = "peak"
hz = 443.9
q = 1.404
gain_db = 11.10

[[formant]]
kind = "peak"
hz = 579.4
q = 1.337
gain_db = -12.01

[[formant]]
kind = "lowpass"
hz = 5445.1
q = 0.631

# Pop bank: tools/fit --pop on the EngineLab pop stages of this profile at
# a73b874 (testdata/legacy/flat12.toml), 7 sections.
[[pop_formant]]
kind = "peak"
hz = 699.6
q = 2.174
gain_db = 19.54

[[pop_formant]]
kind = "peak"
hz = 735.1
q = 0.300
gain_db = -23.87

[[pop_formant]]
kind = "peak"
hz = 1399.9
q = 6.225
gain_db = 11.86

[[pop_formant]]
kind = "peak"
hz = 2106.0
q = 9.766
gain_db = 9.36

[[pop_formant]]
kind = "peak"
hz = 2816.3
q = 11.216
gain_db = 7.04

[[pop_formant]]
kind = "lowpass"
hz = 5637.8
q = 1.706

[[pop_formant]]
kind = "peak"
hz = 15500.7
q = 0.782
gain_db = -23.10

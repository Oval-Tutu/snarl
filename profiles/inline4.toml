# Inline-4, DOHC with a cam profile switch, late 1990s. Firing order
# 1-3-4-2, one bank, 4-2-1 header into one silencer.
name = "inline4"
description = "Inline-4, cam profile switch at 5700 rpm, 4-2-1 header"
seed = 4
idle_rpm = 800
redline_rpm = 8400
limiter_rpm = 8500
limiter_kind = "fuel"
# Cut length, slow-down and climb rates measured from the engine-sim
# limiter reference with the engine running free.
limiter_ms = 56
limiter_fall_rpm_s = 6600
limiter_rise_rpm_s = 10500
limiter_load_scale = 1.0
# Level of the pumping pulses in a cut, their notch after the cut starts,
# and the re-fire bark, measured from the same reference.
limiter_pump_db = 0
limiter_notch_db = -1.5
limiter_bark_db = 6
cam_switch_rpm = 5700

[pulse]
# attack sets a smooth rise, so that the harmonics fall above 2 kHz as in
# engine-sim. cam_attack keeps the ratio of the earlier 26 and 40.
width_deg = 150
attack = 4
decay = 7.5
cam_attack = 6
cam_gain = 0.25
part_load_db = -0.9
cycle_variation = 0.03
jitter = 0.003
gain_variation = 0.25
timing_variation_deg = 5

[exhaust]
crossover = "none"
overlap = 1.0
# Gains of the formant bank and the pop bank at the end of the file.
formant_gain_db = -28.74
pop_formant_gain_db = -3.46
pop_delay_ms = 0.531

[noise]
# hf_gain, am and input_jitter are the engine-sim hf_gain, noise and jitter
# of the inline-4 script (atg-video-1/05_honda_vtec.mr).
hf_gain = 0.002
am = 0.253
am_cutoff_hz = 2000
input_jitter = 0.195

[pops]
density = 0.17
character = "sport"
body_hz = 220
body_ms = 30
# A small stock engine: soft pops and burbles, few deep booms.
weight_pop = 0.5
weight_boom = 0.05
weight_crackle = 0.15
weight_burble = 0.3

[overrun]
level_db = -1.15
idle_level_db = -1.3

[voice]
# leveller_db puts the closed-throttle idle 3 dB below the knee of the
# leveller.
leveller_db = 14.3
output_db = 0.03

[[cylinder]] # 1
crank_deg = 0
bank = 0
primary_m = 0.40
[[cylinder]] # 2
crank_deg = 540
bank = 0
primary_m = 0.42
[[cylinder]] # 3
crank_deg = 180
bank = 0
primary_m = 0.42
[[cylinder]] # 4
crank_deg = 360
bank = 0
primary_m = 0.40

[[path]]
collector_m = 0.95
reflection = -0.4
damping_hz = 3000
gain = 1.0

# Formant bank: tools/fit --base ir --hi 16000 --floor -60 on the engine-sim
# impulse response mild_exhaust of the inline-4 script, 10 sections, weighted
# error 0.90 dB from 40 Hz to 16 kHz. With the -40 dB floor of the other
# profiles, the 6 to 10 kHz bands miss this response by 5 to 10 dB, where
# the input jitter puts its noise, so the floor is -60 dB, as the profile
# importer chooses it.
[[formant]]
kind = "highpass"
hz = 42.2
q = 2.837

[[formant]]
kind = "peak"
hz = 153.7
q = 0.634
gain_db = 32.56

[[formant]]
kind = "peak"
hz = 259.2
q = 1.472
gain_db = -14.68

[[formant]]
kind = "peak"
hz = 410.8
q = 4.324
gain_db = 5.19

[[formant]]
kind = "peak"
hz = 747.7
q = 19.190
gain_db = -6.77

[[formant]]
kind = "peak"
hz = 976.5
q = 20.000
gain_db = -6.57

[[formant]]
kind = "peak"
hz = 4003.2
q = 1.049
gain_db = -12.67

[[formant]]
kind = "lowpass"
hz = 5395.6
q = 0.821

[[formant]]
kind = "peak"
hz = 7710.4
q = 2.883
gain_db = -9.18

[[formant]]
kind = "peak"
hz = 11309.8
q = 4.761
gain_db = -7.55


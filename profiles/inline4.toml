# Inline-4, DOHC with a cam profile switch, late 1990s. Firing order
# 1-3-4-2, one bank, 4-2-1 header into one silencer.
name = "inline4"
description = "Inline-4, cam profile switch at 5700 rpm, 4-2-1 header"
seed = 4
idle_rpm = 800
redline_rpm = 8400
limiter_rpm = 8500
limiter_kind = "fuel"
# Cut length, slow-down and climb rates measured from the engine-sim
# limiter reference with the engine running free.
limiter_ms = 56
limiter_fall_rpm_s = 6600
limiter_rise_rpm_s = 10500
limiter_load_scale = 1.0
# Level of the pumping pulses in a cut, their notch after the cut starts,
# and the re-fire bark, measured from the same reference.
limiter_pump_db = 0
limiter_notch_db = -1.5
limiter_bark_db = 6
cam_switch_rpm = 5700

[pulse]
# The pulse table from engine-sim (measured): tools/fit --pulse on the
# runner pressure of the inline-4 script. Its rows at 5000 and 6000 RPM
# change at the cam switch.
table = "inline4"
cam_gain = 0.25
part_load_db = -0.9
# The firing gain spread of the table (measured_variation 1) replaces
# cycle_variation. The cylinders of the engine-sim inline-4 are nearly the
# same (tools/fit --pulse --variation: a spread of 0.004 in gain and 0.09
# degrees in onset), but gain_variation and timing_variation_deg keep
# their values: with the measured spreads (0.007 and 0.16 degrees), the
# centroid of the holds from 7000 to 8400 RPM is 1238 to 1693 Hz, against
# 1069 to 1506 Hz with these and 909 to 1088 Hz in engine-sim. The fixed
# spread stands in for the two exhaust systems of the engine-sim script,
# which the one path of the profile leaves out.
cycle_variation = 0
measured_variation = 1
jitter = 0.003
gain_variation = 0.25
timing_variation_deg = 5

[exhaust]
crossover = "none"
# No collector overlap: the measured pulse holds the collector of the
# engine-sim inline-4 already. With overlap 1, the loudness band of the
# sweep is 4.1 LU and the crest factor at 8000 RPM 9.1 dB, against 2.3 LU
# and 7.3 dB in engine-sim.
overlap = 0
# Gains of the formant bank and the pop bank at the end of the file.
formant_gain_db = -29.90
pop_formant_gain_db = -3.46
pop_delay_ms = 0.531

[noise]
# hf_gain, am and input_jitter are the engine-sim hf_gain, noise and jitter
# of the inline-4 script (atg-video-1/05_honda_vtec.mr).
hf_gain = 0.002
am = 0.253
am_cutoff_hz = 2000
input_jitter = 0.195

[pops]
density = 0.17
character = "sport"
body_hz = 220
body_ms = 30
# A small stock engine: soft pops and burbles, few deep booms.
weight_pop = 0.5
weight_boom = 0.05
weight_crackle = 0.15
weight_burble = 0.3

[overrun]
level_db = -1.15
idle_level_db = -1.3

[voice]
# leveller_db puts the closed-throttle idle 3 dB below the knee of the
# leveller.
leveller_db = 10.9
output_db = -0.39

[[cylinder]] # 1
crank_deg = 0
bank = 0
primary_m = 0.40
[[cylinder]] # 2
crank_deg = 540
bank = 0
primary_m = 0.42
[[cylinder]] # 3
crank_deg = 180
bank = 0
primary_m = 0.42
[[cylinder]] # 4
crank_deg = 360
bank = 0
primary_m = 0.40

[[path]]
collector_m = 0.95
reflection = -0.4
damping_hz = 3000
gain = 1.0

# Formant bank: tools/fit --base ir --hi 16000 --floor -60 --tolerance 1.5
# on the engine-sim impulse response mild_exhaust of the inline-4 script, 7
# sections, weighted error 1.31 dB from 40 Hz to 16 kHz. With the -40 dB
# floor of the other profiles, the 6 to 10 kHz bands miss this response by
# 5 to 10 dB, where the input jitter puts its noise, so the floor is -60
# dB, as the profile importer chooses it. Against the 1 dB fit of 10
# sections, it leaves out the narrow notches at 748 and 977 Hz and the
# peak at 411 Hz, and costs 15 fewer multiply-adds per sample.
[[formant]]
kind = "highpass"
hz = 43.2
q = 3.253

[[formant]]
kind = "peak"
hz = 151.0
q = 0.587
gain_db = 31.38

[[formant]]
kind = "peak"
hz = 252.8
q = 2.373
gain_db = -13.49

[[formant]]
kind = "peak"
hz = 3974.4
q = 1.278
gain_db = -10.33

[[formant]]
kind = "lowpass"
hz = 5784.0
q = 0.679

[[formant]]
kind = "peak"
hz = 7715.0
q = 2.877
gain_db = -9.17

[[formant]]
kind = "peak"
hz = 11308.6
q = 4.736
gain_db = -7.59

# Pop bank: tools/fit --pop on the EngineLab pop stages of this profile at
# a73b874 (testdata/legacy/inline4.toml), 6 sections.
[[pop_formant]]
kind = "peak"
hz = 784.3
q = 0.300
gain_db = -17.47

[[pop_formant]]
kind = "peak"
hz = 934.8
q = 2.082
gain_db = 15.60

[[pop_formant]]
kind = "peak"
hz = 1905.8
q = 6.234
gain_db = 10.94

[[pop_formant]]
kind = "peak"
hz = 2863.2
q = 8.821
gain_db = 8.30

[[pop_formant]]
kind = "lowpass"
hz = 5571.3
q = 1.767

[[pop_formant]]
kind = "peak"
hz = 15421.8
q = 0.812
gain_db = -21.58

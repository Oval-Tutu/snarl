[pops]
density = 0.25
min_rpm = 2500
body_hz = 160
body_ms = 40
# Large bores and two silencers: deep booms and burbles.
weight_pop = 0.3
weight_boom = 0.35
weight_crackle = 0.15
weight_burble = 0.2

[overrun]
level_db = -0.9
idle_level_db = -0.9


# Cross-plane 90-degree V8, pushrod, late 1980s. Firing order
# 1-3-7-2-6-5-4-8. Bank 0 is cylinders 1 to 4, bank 1 is cylinders 5 to 8.
# Per-bank intervals 90-180-270-180 give the 0.5 and 1.5 order burble.
name = "v8"
description = "Cross-plane V8, shorty headers, H-pipe, two silencers"
seed = 8
idle_rpm = 675
redline_rpm = 6000
limiter_rpm = 6250
# A full cut of every cylinder, as engine-sim cuts.
limiter_kind = "fuel"
# Slow-down and climb rates measured from the engine-sim limiter reference
# with the engine running free. The cut length is set by ear, shorter than
# the 208 ms of the reference, and a random spread of the cut length makes
# the bounce less regular.
limiter_ms = 140
limiter_jitter = 0.15
limiter_fall_rpm_s = 2900
limiter_rise_rpm_s = 9500
limiter_load_scale = 1.0
# Level of the pumping pulses in a cut, their notch after the cut starts,
# and the re-fire bark, measured from the same reference.
limiter_pump_db = -0.3
limiter_notch_db = -18
limiter_bark_db = 2

[pulse]
# attack sets a smooth rise, so that the harmonics fall above 2 kHz as in
# engine-sim.
width_deg = 170
attack = 4
decay = 6.5
cycle_variation = 0.04
jitter = 0.004
gain_variation = 0.12
timing_variation_deg = 2

[exhaust]
crossover = "partial"
coupling = 0.3
overlap = 1.0
# Gains of the formant bank and the pop bank at the end of the file.
formant_gain_db = -15.97
pop_formant_gain_db = -9.76
pop_delay_ms = 0.619

[noise]
# hf_gain, am and input_jitter are the engine-sim hf_gain, noise and jitter
# of the v8 script.
hf_gain = 0.01
am = 1.0
am_cutoff_hz = 2000
input_jitter = 0.6

[pops]
density = 0.2
character = "sport"
body_hz = 160
body_ms = 40
# Large bores and two silencers: deep booms and burbles.
weight_pop = 0.3
weight_boom = 0.35
weight_crackle = 0.15
weight_burble = 0.2

[overrun]
level_db = -0.9
idle_level_db = -0.9

[idle]
variation = 0.28
timing_deg = 2
imbalance = 0.5
hunt = 0.006
rock = 0.01

[voice]
# leveller_db puts the closed-throttle idle 3 dB below the knee of the
# leveller.
leveller_db = 24.5
output_db = 0.73

[[cylinder]] # 1
crank_deg = 0
bank = 0
primary_m = 0.36
[[cylinder]] # 2
crank_deg = 270
bank = 0
primary_m = 0.42
[[cylinder]] # 3
crank_deg = 90
bank = 0
primary_m = 0.40
[[cylinder]] # 4
crank_deg = 540
bank = 0
primary_m = 0.46
[[cylinder]] # 5
crank_deg = 450
bank = 1
primary_m = 0.37
[[cylinder]] # 6
crank_deg = 360
bank = 1
primary_m = 0.41
[[cylinder]] # 7
crank_deg = 180
bank = 1
primary_m = 0.43
[[cylinder]] # 8
crank_deg = 630
bank = 1
primary_m = 0.45

[[path]]
collector_m = 1.10
reflection = -0.45
damping_hz = 2200
gain = 1.0

[[path]]

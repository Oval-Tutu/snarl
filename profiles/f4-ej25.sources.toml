# Sources of the keys of f4-ej25.toml, written by just import-reference.
# kind: upstream (copied from the upstream engine), measured (from its own
# upstream reference renders), snarl (a snarl default for a feature that
# upstream does not have) or not-measured (the core default, because the
# references cannot give it).

[[source]]
key = "name"
kind = "snarl"
from = "the id of the reference engine"

[[source]]
key = "description"
kind = "snarl"
from = "the description of atg-video-1/06_subaru_ej25.mr in tools/import, which names no maker or model"

[[source]]
key = "seed"
kind = "snarl"
from = "the FNV-1a hash of the name, as tools/import seeds every profile"

[[source]]
key = "cylinders"
kind = "upstream"
from = "the cylinders of out/reference/upstream/f4-ej25/engine.json"

[[source]]
key = "idle_rpm"
kind = "upstream"
from = "out/reference/upstream/f4-ej25/engine.json idle.measured_rpm, 832.5 rpm (engine-sim-render: an 8 s free run at speed control 0), rounded to 10 rpm"

[[source]]
key = "redline_rpm"
kind = "upstream"
from = "out/reference/upstream/f4-ej25/engine.json redline_rpm"

[[source]]
key = "limiter_rpm"
kind = "upstream"
from = "out/reference/upstream/f4-ej25/engine.json rev_limit_rpm"

[[source]]
key = "tables"
kind = "measured"
from = "profiles/cycles/f4-ej25.bin of just cycles-grid f4-ej25: tools/cycles build of the engine-sim renders of the grid scenarios in scenarios/upstream/f4-ej25/grid at the simulation rate of the unchanged script, in out/cycles/grid/f4-ej25: 185 points, of which 51 are slices of the closing steps of close.scn (docs/research/cycle-tables.md)"

[[source]]
key = "volume"
kind = "snarl"
from = "half the engine-sim-render --volume 0.5 of the reference renders of just ref-upstream, so that the pops have 6 dB of room above the engine level of the references: core default"

[[source]]
key = "throttle.close_lag_s"
kind = "measured"
from = "the intake lag of profiles/cycles/f4-ej25.bin, 0.050 s: tools/cycles build --step out/cycles/grid/f4-ej25/step fits exp(-t/tau) to the share of the state before the step in each cycle after the full to closed throttle step of scenarios/upstream/f4-ej25/grid/step.scn at 3750 rpm (out/cycles/grid/f4-ej25/build.md)"

[[source]]
key = "throttle.open_lag_s"
kind = "measured"
from = "the intake lag of profiles/cycles/f4-ej25.bin, 0.052 s: tools/cycles build --step out/cycles/grid/f4-ej25/step fits exp(-t/tau) to the share of the state before the step in each cycle after the closed to full throttle step of scenarios/upstream/f4-ej25/grid/step.scn at 3750 rpm (out/cycles/grid/f4-ej25/build.md)"

[[source]]
key = "limiter.cut_ms"
kind = "measured"
from = "the median cut, from a peak of the RPM to the next trough where the lines through the climbs and the falls meet, of the 27 bounces of the free run at full throttle of out/reference/upstream/f4-ej25/limiter-free.csv from 1.5 to 5.5 s, with the RPM averaged over one engine cycle at the rev limit (tools/import measureBounce): 100.2 ms (the dump limiter_duration_s is 0.08 s)"

[[source]]
key = "limiter.fall_rpm_s"
kind = "measured"
from = "the median fall rate in the cuts, the slope of a straight line through the RPM from half a cycle after a peak to half a cycle before the trough, of the 27 bounces of the free run at full throttle of out/reference/upstream/f4-ej25/limiter-free.csv from 1.5 to 5.5 s, with the RPM averaged over one engine cycle at the rev limit (tools/import measureBounce), with median peaks and troughs of 6548 and 5966 rpm"

[[source]]
key = "limiter.rise_rpm_s"
kind = "measured"
from = "the median climb rate, the slope of a straight line through the RPM from half a cycle after a trough to half a cycle before the next peak, of the 27 bounces of the free run at full throttle of out/reference/upstream/f4-ej25/limiter-free.csv from 1.5 to 5.5 s, with the RPM averaged over one engine cycle at the rev limit (tools/import measureBounce)"

[[source]]
key = "limiter.load_scale"
kind = "snarl"
from = "the rates of the free run with no load from a gear: core default"

[[source]]
key = "limiter.final_gear_waver"
kind = "snarl"
from = "the final gear hold, a snarl-only feature: core default"

[[source]]
key = "idle.fade_rpm"
kind = "not-measured"
from = "the free runs give the wander at idle only: idle_rpm plus 1400 rpm, the tools/import rule"

[[source]]
key = "idle.hunt"
kind = "measured"
from = "the spread of the RPM averaged over one engine cycle over the mean RPM of the free run at throttle 0 of out/reference/upstream/f4-ej25/idle-free.csv from 2 to 11 s, 18.9 over 852.5 rpm (25.3 rpm with no averaging), over 0.7036, the spread of the idle wander of the engine per unit of hunt"

[[source]]
key = "idle.hunt_hz"
kind = "measured"
from = "the main wander frequency of the free run at throttle 0 of out/reference/upstream/f4-ej25/idle-free.csv from 2 to 11 s, 0.684 Hz at 12.3 rpm"

[[source]]
key = "pops.density"
kind = "snarl"
from = "pops are a snarl-only feature: the tools/import default, so that the own pops play (the core default 0 turns them off)"

[[source]]
key = "pops.character"
kind = "snarl"
from = "pops are a snarl-only feature: core default"

[[source]]
key = "pops.gain"
kind = "snarl"
from = "pops are a snarl-only feature: core default"

[[source]]
key = "pops.body_ms"
kind = "snarl"
from = "pops are a snarl-only feature: core default"

[[source]]
key = "pops.limiter_bangs"
kind = "snarl"
from = "pops are a snarl-only feature: the engine-sim ignition module cuts the spark with no afterfire (src/ignition_module.cpp), so a cut does not bang"

[[source]]
key = "pops.weight_pop"
kind = "snarl"
from = "pops are a snarl-only feature: core default"

[[source]]
key = "pops.weight_boom"
kind = "snarl"
from = "pops are a snarl-only feature: core default"

[[source]]
key = "pops.weight_crackle"
kind = "snarl"
from = "pops are a snarl-only feature: core default"

[[source]]
key = "pops.weight_burble"
kind = "snarl"
from = "pops are a snarl-only feature: core default"

[[source]]
key = "channel.impulse_response"
kind = "upstream"
from = "the impulse response of the exhaust system of the channel that profiles/cycles/f4-ej25.bin names, the impulse_response of the exhaust systems of out/reference/upstream/f4-ej25/engine.json, copied unchanged from the es directory of the engine-sim package to profiles/ir"

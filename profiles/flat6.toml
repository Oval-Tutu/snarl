# Air-cooled boxer flat-6, mid 1990s. Firing order 1-6-2-4-3-5. Bank 0 is
# cylinders 1 to 3, bank 1 is cylinders 4 to 6. Each bank fires every 240
# degrees. The heat exchangers feed a centre mixing chamber, a full merge.
name = "flat6"
description = "Air-cooled flat-6, heat exchangers into a mixing chamber, fan"
seed = 6
idle_rpm = 800
redline_rpm = 6800
limiter_rpm = 6700
# A full cut of every cylinder, as engine-sim cuts.
limiter_kind = "fuel"
# Cut length, slow-down and climb rates measured from the engine-sim
# limiter reference with the engine running free.
limiter_ms = 163
limiter_fall_rpm_s = 4800
limiter_rise_rpm_s = 10800
limiter_load_scale = 1.0
# Level of the pumping pulses in a cut, their notch after the cut starts,
# and the re-fire bark, measured from the same reference.
limiter_pump_db = 0
limiter_notch_db = -2
limiter_bark_db = 2

[pulse]
width_deg = 150
attack = 24
decay = 7
cycle_variation = 0.03
jitter = 0.003
gain_variation = 0.02
timing_variation_deg = 0.5

[exhaust]
crossover = "full"
outlet_direct = 0.35
steepening = 0.3
overlap = 1.0
low_shelf_db = 1

[noise]
am = 0.2
jet = 0.02
jet_hz = 1500
intake = 0.06
intake_hz = 330

[mechanical]
fan_ratio = 1.8
fan_blades = 5
fan_gain = 0.02
tick_gain = 0.05
tick_hz = 2500

[pops]
density = 0.2
character = "sport"
body_hz = 190
body_ms = 35
# Heat exchangers and a mixing chamber: mostly round pops, some crackle.
weight_pop = 0.45
weight_boom = 0.15
weight_crackle = 0.3
weight_burble = 0.1

[overrun]
level_db = -1.2
idle_level_db = -0.75

[idle]
variation = 0.12
timing_deg = 3
imbalance = 0.06
hunt = 0.005
rock = 0.02

[voice]
output_db = 5.7
idle_gain_db = 3.5
idle_gain_rpm = 5600


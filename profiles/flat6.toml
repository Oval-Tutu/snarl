# Air-cooled boxer flat-6, mid 1990s. Firing order 1-6-2-4-3-5. Bank 0 is
# cylinders 1 to 3, bank 1 is cylinders 4 to 6. Each bank fires every 240
# degrees. The heat exchangers feed a centre mixing chamber, a full merge.
name = "flat6"
description = "Air-cooled flat-6, heat exchangers into a mixing chamber"
seed = 6
idle_rpm = 800
redline_rpm = 6800
limiter_rpm = 6700
# A full cut of every cylinder, as engine-sim cuts.
limiter_kind = "fuel"
# Cut length, slow-down and climb rates measured from the engine-sim
# limiter reference with the engine running free.
limiter_ms = 163
limiter_fall_rpm_s = 4800
limiter_rise_rpm_s = 10800
limiter_load_scale = 1.0
# Level of the pumping pulses in a cut, their notch after the cut starts,
# and the re-fire bark, measured from the same reference.
limiter_pump_db = 0
limiter_notch_db = -2
limiter_bark_db = 2

[pulse]
# The pulse table from engine-sim (measured): tools/fit --pulse on the
# runner pressure of the flat-6 script.
table = "flat6"
# The firing gain spread of the table (measured_variation 1) replaces
# cycle_variation. gain_variation and timing_variation_deg are sqrt(3)
# times the median spread of the cylinder means of the measured holds
# (tools/fit --pulse --variation): 0.009 in gain and 0.77 degrees.
cycle_variation = 0
measured_variation = 1
jitter = 0.003
gain_variation = 0.016
timing_variation_deg = 1.33

[exhaust]
crossover = "full"
overlap = 1.0
# Gains of the formant bank and the pop bank at the end of the file.
formant_gain_db = -19.00
pop_formant_gain_db = -8.72
pop_delay_ms = 0.566

[noise]
# hf_gain, am and input_jitter are the engine-sim hf_gain, noise and jitter
# of the flat6 script.
hf_gain = 0.01
am = 1.0
am_cutoff_hz = 2000
input_jitter = 0.5

[pops]
density = 0.2
character = "sport"
body_hz = 190
body_ms = 35
# Heat exchangers and a mixing chamber: mostly round pops, some crackle.
weight_pop = 0.45
weight_boom = 0.15
weight_crackle = 0.3
weight_burble = 0.1

[overrun]
level_db = -1.2
idle_level_db = -0.75

[idle]
# No timing_deg: in engine-sim (tools/fit --pulse --variation), the onset
# spread of the firings is no larger at the closed-throttle idle than at
# full throttle. With timing_deg 3, the residual of the closed-throttle
# idle with no hunt is -10.1 dB and the part from 0.5 to 2 kHz -23.4 dB,
# against -16.1 and -27.7 dB in engine-sim: the delay spread turns the
# upper harmonics into noise. With 0, they are -14.8 and -28.7 dB.
variation = 0.12
timing_deg = 0
imbalance = 0.06
hunt = 0.005
rock = 0.02

[voice]
# leveller_db puts the closed-throttle idle 3 dB below the knee of the
# leveller.
leveller_db = 23.5
output_db = 0.17

[[cylinder]] # 1
crank_deg = 0
bank = 0
primary_m = 0.40
[[cylinder]] # 2
crank_deg = 240
bank = 0
primary_m = 0.55
[[cylinder]] # 3
crank_deg = 480
bank = 0
primary_m = 0.70
[[cylinder]] # 4
crank_deg = 360
bank = 1
primary_m = 0.46
[[cylinder]] # 5
crank_deg = 600
bank = 1
primary_m = 0.61
[[cylinder]] # 6
crank_deg = 120
bank = 1
primary_m = 0.76

[[path]]
collector_m = 0.85
reflection = -0.4
damping_hz = 2500
gain = 1.0

[[path]]
collector_m = 0.92
reflection = -0.4
damping_hz = 2500
gain = 0.85
listener_m = 0.25

# Formant bank: tools/fit --base ir --hi 16000 --tolerance 1.5 on the
# engine-sim impulse response minimal_muffling_02 of the flat6 script, 4
# sections, weighted error 1.44 dB from 40 Hz to 16 kHz. Against the 1 dB
# fit of 8 sections, it leaves out the narrow notches at 134 and 189 Hz
# and the narrow peak at 933 Hz, and costs 20 fewer multiply-adds per
# sample.
[[formant]]
kind = "highpass"
hz = 97.8
q = 1.309

[[formant]]
kind = "peak"
hz = 254.8
q = 1.500
gain_db = 16.85

[[formant]]
kind = "peak"
hz = 393.7
q = 3.219
gain_db = 9.75

[[formant]]
kind = "lowpass"
hz = 1973.9
q = 0.963

# Pop bank: tools/fit --pop on the EngineLab pop stages of this profile at
# a73b874 (testdata/legacy/flat6.toml), 7 sections.
[[pop_formant]]
kind = "peak"
hz = 782.3
q = 0.300
gain_db = -20.96

[[pop_formant]]
kind = "peak"
hz = 869.3
q = 1.743
gain_db = 22.32

[[pop_formant]]
kind = "peak"
hz = 1770.3
q = 5.723
gain_db = 13.97

[[pop_formant]]
kind = "peak"
hz = 2651.1
q = 7.875
gain_db = 11.77

[[pop_formant]]
kind = "peak"
hz = 3544.1
q = 9.082
gain_db = 8.80

[[pop_formant]]
kind = "lowpass"
hz = 5609.1
q = 2.410

[[pop_formant]]
kind = "peak"
hz = 15306.2
q = 0.961
gain_db = -18.94

# Air-cooled boxer flat-6, mid 1990s. Firing order 1-6-2-4-3-5. Bank 0 is
# cylinders 1 to 3, bank 1 is cylinders 4 to 6. Each bank fires every 240
# degrees. The heat exchangers feed a centre mixing chamber, a full merge.
name = "flat6"
description = "Air-cooled flat-6, heat exchangers into a mixing chamber"
seed = 6
idle_rpm = 800
redline_rpm = 6800
limiter_rpm = 6700
# A full cut of every cylinder, as engine-sim cuts.
limiter_kind = "fuel"
# Cut length, slow-down and climb rates measured from the engine-sim
# limiter reference with the engine running free.
limiter_ms = 163
limiter_fall_rpm_s = 4800
limiter_rise_rpm_s = 10800
limiter_load_scale = 1.0
# Level of the pumping pulses in a cut, their notch after the cut starts,
# and the re-fire bark, measured from the same reference.
limiter_pump_db = 0
limiter_notch_db = -2
limiter_bark_db = 2

[pulse]
# attack sets a smooth rise, so that the harmonics fall above 2 kHz as in
# engine-sim.
width_deg = 150
attack = 4
decay = 7
cycle_variation = 0.03
jitter = 0.003
gain_variation = 0.02
timing_variation_deg = 0.5

[exhaust]
crossover = "full"
overlap = 1.0
# Gains of the formant bank and the pop bank at the end of the file.
formant_gain_db = -14.80
pop_formant_gain_db = -8.72
pop_delay_ms = 0.566

[noise]
# hf_gain, am and input_jitter are the engine-sim hf_gain, noise and jitter
# of the flat6 script.
hf_gain = 0.01
am = 1.0
am_cutoff_hz = 2000
input_jitter = 0.5

[pops]
density = 0.2
character = "sport"
body_hz = 190
body_ms = 35
# Heat exchangers and a mixing chamber: mostly round pops, some crackle.
weight_pop = 0.45
weight_boom = 0.15
weight_crackle = 0.3
weight_burble = 0.1

[overrun]
level_db = -1.2
idle_level_db = -0.75

[idle]
variation = 0.12
timing_deg = 3
imbalance = 0.06
hunt = 0.005
rock = 0.02

[voice]
# leveller_db puts the closed-throttle idle 3 dB below the knee of the
# leveller.
leveller_db = 19.0
output_db = 0.27

[[cylinder]] # 1
crank_deg = 0
bank = 0
primary_m = 0.40
[[cylinder]] # 2
crank_deg = 240
bank = 0
primary_m = 0.55
[[cylinder]] # 3
crank_deg = 480
bank = 0
primary_m = 0.70
[[cylinder]] # 4
crank_deg = 360
bank = 1
primary_m = 0.46
[[cylinder]] # 5
crank_deg = 600
bank = 1
primary_m = 0.61
[[cylinder]] # 6
crank_deg = 120
bank = 1
primary_m = 0.76

[[path]]
collector_m = 0.85
reflection = -0.4
damping_hz = 2500
gain = 1.0

[[path]]
collector_m = 0.92
reflection = -0.4
damping_hz = 2500
gain = 0.85
listener_m = 0.25

# Formant bank: tools/fit --base ir --hi 16000 on the engine-sim impulse
# response minimal_muffling_02 of the flat6 script, 8 sections, weighted
# error 0.96 dB from 40 Hz to 16 kHz.
[[formant]]
kind = "highpass"
hz = 106.6
q = 0.495

[[formant]]
kind = "peak"
hz = 133.8
q = 9.691
gain_db = -6.56

[[formant]]
kind = "peak"
hz = 189.2
q = 6.833
gain_db = -15.61

[[formant]]
kind = "peak"
hz = 205.7
q = 0.747
gain_db = 21.05

[[formant]]
kind = "peak"
hz = 422.4
q = 0.835
gain_db = 22.38

[[formant]]
kind = "peak"
hz = 535.6
q = 0.525
gain_db = -23.05

[[formant]]
kind = "peak"
hz = 932.7
q = 10.485
gain_db = 5.01

[[formant]]
kind = "lowpass"
hz = 1777.2
q = 1.170

# Pop bank: tools/fit --pop on the EngineLab pop stages of this profile at
# a73b874 (testdata/legacy/flat6.toml), 7 sections.

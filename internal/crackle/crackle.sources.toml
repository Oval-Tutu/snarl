# Sources of the keys of crackle.toml, written by just crackle-fit.
# kind: measured (a statistic of the 30 clips by tools/crackle), fitted (a
# deterministic fit by tools/crackle --fit of model trains to a statistic
# of the clips) or snarl (a snarl default where the clips cannot measure
# the value).

[[source]]
key = "length_ms"
kind = "measured"
from = "the minimum, quartiles and maximum of the active length of the 30 clips (tools/crackle), the range of the length control"

[[source]]
key = "length_offset_ms"
kind = "fitted"
from = "fitted by the search of tools/crackle --fit (just crackle-fit): the compass search of 18 knobs that lowers the loss over the measures of the check, the distance of the model median from the clip median over the clip interquartile range, on 64 model trains with the seeds 1 to 64, to 0.719; the start is the median tail after the last shock of the clips and 10 ms; the median active length is 544 ms for the clips and 515 ms for the model"

[[source]]
key = "shocks_range"
kind = "measured"
from = "the least and the most shocks of a clip over the 30 clips (tools/crackle), the range of the length control"

[[source]]
key = "gap_ms"
kind = "measured"
from = "the quantiles at the probabilities (i + 0.5) / 21 of the 1221 gaps between all shocks of the 30 clips, pooled (tools/crackle)"

[[source]]
key = "gap_scale"
kind = "fitted"
from = "fitted by the search of tools/crackle --fit (just crackle-fit): the compass search of 18 knobs that lowers the loss over the measures of the check, the distance of the model median from the clip median over the clip interquartile range, on 64 model trains with the seeds 1 to 64, to 0.719; the start is 1; the median shock rate is 77 per second for the clips and 86 for the model"

[[source]]
key = "level_db"
kind = "measured"
from = "the quantiles at the probabilities (i + 0.5) / 21 of the level of the 1251 shocks of the 30 clips against the strongest shock of their clip, pooled (tools/crackle)"

[[source]]
key = "level_scale"
kind = "fitted"
from = "fitted by the search of tools/crackle --fit (just crackle-fit): the compass search of 18 knobs that lowers the loss over the measures of the check, the distance of the model median from the clip median over the clip interquartile range, on 64 model trains with the seeds 1 to 64, to 0.719; the start is 1; 0.18 of the shocks are strong for the clips and 0.20 for the model"

[[source]]
key = "level_corr"
kind = "fitted"
from = "fitted by the search of tools/crackle --fit (just crackle-fit): the compass search of 18 knobs that lowers the loss over the measures of the check, the distance of the model median from the clip median over the clip interquartile range, on 64 model trains with the seeds 1 to 64, to 0.719; the start is the correlation of the levels of consecutive shocks of the clips, pooled, 0.29; it is 0.52 for the model"

[[source]]
key = "place_db"
kind = "fitted"
from = "fitted by the search of tools/crackle --fit (just crackle-fit): the compass search of 18 knobs that lowers the loss over the measures of the check, the distance of the model median from the clip median over the clip interquartile range, on 64 model trains with the seeds 1 to 64, to 0.719; the start is the median level of the shocks in each tenth of the active span of the clips, pooled, against the pooled median level, with a scale that the search moves from 1"

[[source]]
key = "attack_ms"
kind = "fitted"
from = "fitted by the search of tools/crackle --fit (just crackle-fit): the compass search of 18 knobs that lowers the loss over the measures of the check, the distance of the model median from the clip median over the clip interquartile range, on 64 model trains with the seeds 1 to 64, to 0.719; the start is the median rise above 1 kHz of the strong shocks of the clips over 0.8; the median rise is 2.39 ms for the clips and 3.52 ms for the model"

[[source]]
key = "decay_ms"
kind = "fitted"
from = "fitted by the search of tools/crackle --fit (just crackle-fit): the compass search of 18 knobs that lowers the loss over the measures of the check, the distance of the model median from the clip median over the clip interquartile range, on 64 model trains with the seeds 1 to 64, to 0.719; the start is the median fall of the strong shocks of the clips to -10 dB, 0.57 ms; it is 0.88 ms for the model"

[[source]]
key = "ring_ms"
kind = "fitted"
from = "fitted by the search of tools/crackle --fit (just crackle-fit): the compass search of 18 knobs that lowers the loss over the measures of the check, the distance of the model median from the clip median over the clip interquartile range, on 64 model trains with the seeds 1 to 64, to 0.719; the start is the fall above 2 kHz from the frame 5 ms after the strongest shock to the frame 20 ms after it, median over the clips, as an exponential decay"

[[source]]
key = "shock_db"
kind = "fitted"
from = "fitted by tools/crackle --fit: the gains by 500 Richardson-Lucy steps that give the band powers of the frame of the onset of the strongest shock and the frame after it, against the loudest frame of a clip, from the medians over the 30 clips of the band energy over time around the strongest shock (tools/crackle), less the background; 15 steps of the fit correct the band powers by the errors of the band energy of the model trains, and the search moves the level of all bands"

[[source]]
key = "ring_db"
kind = "fitted"
from = "fitted by tools/crackle --fit: the gains by 500 Richardson-Lucy steps that give the band powers of the frames 10, 20 and 40 ms after the strongest shock, against the loudest frame of a clip, from the medians over the 30 clips of the band energy over time around the strongest shock (tools/crackle), less the background; 15 steps of the fit correct the band powers by the errors of the band energy of the model trains, and the search moves the level of all bands"

[[source]]
key = "bed_db"
kind = "fitted"
from = "fitted by tools/crackle --fit: the gains by 500 Richardson-Lucy steps that give the band powers of the frames 10 and 5 ms before the strongest shock; the bands below 125 Hz are the body alone, against the loudest frame of a clip, from the medians over the 30 clips of the band energy over time around the strongest shock (tools/crackle), less the background; 15 steps of the fit correct the band powers by the errors of the band energy of the model trains, and the search moves the level of all bands"

[[source]]
key = "top_hz"
kind = "fitted"
from = "fitted by the search of tools/crackle --fit (just crackle-fit): the compass search of 18 knobs that lowers the loss over the measures of the check, the distance of the model median from the clip median over the clip interquartile range, on 64 model trains with the seeds 1 to 64, to 0.719; the start is the corner from 8 to 19 kHz at which the banks come nearest to their band powers"

[[source]]
key = "body_hz"
kind = "fitted"
from = "fitted by the search of tools/crackle --fit (just crackle-fit): the compass search of 18 knobs that lowers the loss over the measures of the check, the distance of the model median from the clip median over the clip interquartile range, on 64 model trains with the seeds 1 to 64, to 0.719; the start is the median body peak of the clips; it is 52.2 Hz for the clips and 49.6 Hz for the model"

[[source]]
key = "body_q"
kind = "fitted"
from = "fitted by the search of tools/crackle --fit (just crackle-fit): the compass search of 18 knobs that lowers the loss over the measures of the check, the distance of the model median from the clip median over the clip interquartile range, on 64 model trains with the seeds 1 to 64, to 0.719; the start is 2; the median spread of the body cycles is 0.23 for the clips and 0.20 for the model"

[[source]]
key = "body_gain_db"
kind = "fitted"
from = "fitted by tools/crackle --fit: the gain of the body filter for white noise that gives the median over the 30 clips of the band energy from 31.25 to 62.5 Hz in the frames 10 and 5 ms before the strongest shock, against the loudest frame, with a level that the search moves from 0 dB"

[[source]]
key = "fade_delay_ms"
kind = "fitted"
from = "fitted by the search of tools/crackle --fit (just crackle-fit): the compass search of 18 knobs that lowers the loss over the measures of the check, the distance of the model median from the clip median over the clip interquartile range, on 64 model trains with the seeds 1 to 64, to 0.719; the start is the median tail after the last shock of the clips; it is 69 ms for the clips and 69 ms for the model"

[[source]]
key = "fade_db_per_ms"
kind = "fitted"
from = "fitted by the search of tools/crackle --fit (just crackle-fit): the compass search of 18 knobs that lowers the loss over the measures of the check, the distance of the model median from the clip median over the clip interquartile range, on 64 model trains with the seeds 1 to 64, to 0.719; the start is the median fall over the last 20 ms of the active span of the clips over 20 ms; the fall is -18.0 dB for the clips and -16.9 dB for the model"

[[source]]
key = "fade_in_ms"
kind = "snarl"
from = "a snarl default against a click at the start: the clips start cut, with sound at the first sample, so they cannot give a fade-in"

[[source]]
key = "preroll_ms"
kind = "snarl"
from = "a snarl default: the clips start with the event under way, with sound at the first sample, so the bed and the body run for more than two body cycles and the ring of the body filter before the first sample"

[[source]]
key = "tail_hz"
kind = "measured"
from = "the median over the clips of the tail frequency from the median half cycle after the last shock (tools/crackle), n=13"

[[source]]
key = "tail_decay_ms"
kind = "measured"
from = "the median over the clips of the tail decay to -20 dB after the last shock (tools/crackle), n=13"

[[source]]
key = "tail_gain_db"
kind = "fitted"
from = "fitted by the search of tools/crackle --fit (just crackle-fit): the compass search of 18 knobs that lowers the loss over the measures of the check, the distance of the model median from the clip median over the clip interquartile range, on 64 model trains with the seeds 1 to 64, to 0.719; the start is the peak of a sine with the RMS level of the body; the median tail peak is 28 Hz for the clips and 27 Hz for the model"

[[source]]
key = "out_db"
kind = "fitted"
from = "the gain that brings the median sample peak of the 64 fit trains, 4.84 dBFS, to the median sample peak of the clips, -0.41 dBFS"
